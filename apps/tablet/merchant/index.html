<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Crave'n Merchant</title>
    <style>
      @media screen and (orientation: portrait) {
        html, body {
          transform: rotate(90deg);
          transform-origin: center center;
          width: 100vh;
          height: 100vw;
          position: absolute;
          top: 50%;
          left: 50%;
          margin-left: -50vh;
          margin-top: -50vw;
          overflow: hidden;
          background: #ffffff;
        }
      }
      @media screen and (orientation: landscape) {
        html, body {
          width: 100vw;
          height: 100vh;
          margin: 0;
          padding: 0;
          background: #ffffff;
        }
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:100vh;background:#fff;">
        <div style="text-align:center;">
          <div style="width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#ea580c;border-radius:50%;animation:merchant-spin .8s linear infinite;margin:0 auto 12px;"></div>
          <div style="font-size:14px;color:#6b7280;">Loading…</div>
        </div>
      </div>
    </div>
    <style>@keyframes merchant-spin{to{transform:rotate(360deg);}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
