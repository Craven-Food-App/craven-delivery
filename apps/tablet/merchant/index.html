<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23ea580c' rx='4'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'>C</text></svg>" />
    <title>Crave'n Merchant</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
      }

      /* Orientation locked to landscape via AndroidManifest; no rotate message */
      #root {
        width: 100%;
        height: 100%;
      }

      .merchant-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      .merchant-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e5e7eb;
        border-top-color: #ea580c;
        border-radius: 50%;
        animation: merchant-spin 0.8s linear infinite;
        margin: 0 auto 12px;
      }

      @keyframes merchant-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="merchant-loader">
        <div style="text-align:center;">
          <div class="merchant-spinner"></div>
          <div style="font-size:14px;color:#6b7280;">Loading…</div>
        </div>
      </div>
    </div>

    <!-- IMPORTANT: no leading slash for Capacitor build -->
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
