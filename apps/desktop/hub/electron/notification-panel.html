<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' file: data:; script-src 'unsafe-inline';"
    />
    <title>Craven Hub</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121214;
        --bg-elevated: #1a1a1e;
        --line: rgba(255, 255, 255, 0.1);
        --text: #f4f4f5;
        --muted: rgba(244, 244, 245, 0.62);
        --accent: #ff7a45;
        --accent-strong: #ff5a1f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      .shell {
        height: 100%;
        padding: 8px;
      }

      .card {
        position: relative;
        height: calc(100% - 16px);
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 12px;
        padding: 16px 16px 22px;
        border-radius: 14px;
        background:
          linear-gradient(180deg, rgba(255, 122, 69, 0.12), transparent 42%),
          linear-gradient(160deg, #1c1c21 0%, #101013 100%);
        border: 1px solid var(--line);
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(255, 122, 69, 0.08) inset;
        transform: translateY(12px);
        opacity: 0;
        animation: rise-in 180ms ease-out forwards;
      }

      @keyframes rise-in {
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .header {
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }

      .mark {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        object-fit: cover;
        background: #0b0b0d;
        flex: 0 0 auto;
      }

      .meta {
        min-width: 0;
        flex: 1;
      }

      .eyebrow {
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .title {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        line-height: 1.25;
        color: var(--text);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .dismiss {
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: rgba(244, 244, 245, 0.45);
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .dismiss:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }

      .body {
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      button.action {
        height: 34px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      button.action.primary {
        border-color: transparent;
        background: var(--accent);
      }

      button.action.primary:hover {
        background: var(--accent-strong);
      }

      button.action.secondary:hover {
        background: rgba(255, 255, 255, 0.08);
      }

      .progress {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 18px;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        pointer-events: none;
      }

      .progress > span {
        display: block;
        height: 100%;
        width: 100%;
        transform-origin: left center;
        background: var(--accent);
        animation: drain linear forwards;
      }

      @keyframes drain {
        from {
          transform: scaleX(1);
        }
        to {
          transform: scaleX(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <article class="card" id="card">
        <header class="header">
          <img class="mark" id="mark" alt="" />
          <div class="meta">
            <p class="eyebrow" id="eyebrow">Craven Hub</p>
            <h1 class="title" id="title"></h1>
          </div>
          <button class="dismiss" id="dismiss" type="button" aria-label="Dismiss">×</button>
        </header>
        <p class="body" id="body"></p>
        <div class="actions">
          <button class="action secondary" id="later" type="button">Dismiss</button>
          <button class="action primary" id="open" type="button">Open</button>
        </div>
        <div class="progress"><span id="timer"></span></div>
      </article>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || '';
      const title = params.get('title') || 'Notification';
      const body = params.get('body') || '';
      const route = params.get('route') || '/hub';
      const icon = params.get('icon') || '';
      const kind = params.get('kind') || 'Update';
      const durationMs = Number(params.get('durationMs') || 9000);

      document.getElementById('title').textContent = title;
      document.getElementById('body').textContent = body;
      document.getElementById('eyebrow').textContent = kind;
      document.getElementById('timer').style.animationDuration = `${durationMs}ms`;
      if (icon) document.getElementById('mark').src = icon;

      const close = (action) => {
        window.cravenNotificationPanel.action({ id, action, route });
      };

      document.getElementById('open').addEventListener('click', () => close('open'));
      document.getElementById('later').addEventListener('click', () => close('dismiss'));
      document.getElementById('dismiss').addEventListener('click', () => close('dismiss'));
      document.getElementById('card').addEventListener('click', (event) => {
        if (event.target.closest('button')) return;
        close('open');
      });

      window.setTimeout(() => close('timeout'), durationMs);
    </script>
  </body>
</html>
