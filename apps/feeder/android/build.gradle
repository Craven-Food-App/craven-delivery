// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.3'
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

/**
 * Stable setup for Capacitor + AGP:
 * - Gradle can RUN on JDK 21 (your machine already does)
 * - Compile ALL Android Java/Kotlin bytecode to 17 (most compatible)
 * - Do NOT use JavaCompile.options.release
 * - Do NOT set javaCompiler toolchains (AGP can finalize tasks)
 * - Do NOT set Kotlin jvmToolchain here (can trigger JDK toolchain resolution)
 */
subprojects { subproj ->
    afterEvaluate {

        // Android modules: compile Java as 17
        if (subproj.plugins.hasPlugin("com.android.application") || subproj.plugins.hasPlugin("com.android.library")) {
            subproj.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }

        // Kotlin: compile to JVM bytecode 17
        subproj.tasks.matching { t ->
            def n = t.name.toLowerCase()
            n.startsWith("compile") && n.contains("kotlin")
        }.configureEach { t ->
            if (t.hasProperty("kotlinOptions")) {
                t.kotlinOptions.jvmTarget = "17"
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
