    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; padding: 0; background: #fafafa; }
      #root { min-height: 100vh; }
      body.pwa-standalone.app-route {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        overscroll-behavior: none;
      }
      body.pwa-standalone.app-route,
      body.pwa-standalone.app-route #root {
        height: 100dvh;
      }
    </style>

    <script>
      (function () {
        var pathAndHash = (window.location.pathname || "") + (window.location.hash || "");
        var isFeeder = pathAndHash.indexOf("/mobile") !== -1;
        var isMerchant = pathAndHash.indexOf("/merchant-portal") !== -1;
        var isAppRoute = isFeeder || isMerchant;

        if (isFeeder) {
          var titleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (titleMeta) titleMeta.setAttribute("content", "Feeder");

          var icons = document.querySelectorAll('link[rel="apple-touch-icon"]');
          for (var i = 0; i < icons.length; i++) {
            icons[i].setAttribute("href", "/feeder_app_icon.png");
          }
        } else if (isMerchant) {
          var titleMetaM = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (titleMetaM) titleMetaM.setAttribute("content", "Crave'n Merchant");

          var iconsM = document.querySelectorAll('link[rel="apple-touch-icon"]');
          for (var j = 0; j < iconsM.length; j++) {
            iconsM[j].setAttribute("href", "/merchant_app_icon.png");
          }
        }

        function applyBodyClasses() {
          if (!document.body) return setTimeout(applyBodyClasses, 10);

          var isStandalone =
            (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
            (window.navigator && window.navigator.standalone === true);

          if (isStandalone) document.body.classList.add("pwa-standalone");
          if (isStandalone && isAppRoute) document.body.classList.add("app-route");
        }

        applyBodyClasses();
      })();
    </script>
    <meta property="og:title" content="Crave&#39;N — Food, Grocery, Retail, Convenience &amp; Courier (CX)">
